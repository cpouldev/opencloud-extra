name: OpenCloud Extra stable release

on:
  schedule:
    - cron: '23 5 * * *'
  push:
    branches: [extra/stable]
  workflow_dispatch:
    inputs:
      force_release:
        description: Publish a new extra revision even when source has not changed
        type: boolean
        default: false

# Token-created pushes do not trigger another run. Preparation, checks and
# publication are explicitly connected in this workflow instead.
concurrency:
  group: opencloud-extra-stable-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  GH_HOST: github.com

jobs:
  prepare:
    if: github.repository == 'cpouldev/opencloud-extra' && github.ref == 'refs/heads/extra/stable'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      needed: ${{ steps.plan.outputs.needed }}
      base: ${{ steps.plan.outputs.base }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: extra/stable
          fetch-depth: 0
          persist-credentials: false
      - name: Test release decisions
        run: python3 -m unittest discover -s extras/release -p 'test_*.py' -v
      - name: Prepare latest stable upstream candidate
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_RELEASE: ${{ inputs.force_release || false }}
        run: |
          args=()
          if [[ "$FORCE_RELEASE" == "true" ]]; then args+=(--force); fi
          python3 extras/release/release.py prepare "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: steps.plan.outputs.needed == 'true'
        with:
          name: extra-candidate
          path: /tmp/extra-release/
          retention-days: 3

  validate:
    needs: prepare
    if: needs.prepare.outputs.needed == 'true'
    uses: ./.github/workflows/extra-validate.yml
    with:
      base: ${{ needs.prepare.outputs.base }}
      candidate_artifact: extra-candidate
      save_images: true

  publish:
    needs: [prepare, validate]
    if: github.repository == 'cpouldev/opencloud-extra' && github.ref == 'refs/heads/extra/stable' && needs.prepare.outputs.needed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      # Run mutation code from the trusted starting commit, not the merged tree.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.base }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: extra-candidate
          path: /tmp/extra-release
      - uses: actions/download-artifact@v4
        with:
          pattern: extra-image-*
          merge-multiple: true
          path: /tmp/extra-release
      - uses: docker/setup-buildx-action@v3
      - name: Log in to the downstream Docker repository
        uses: docker/login-action@v3
        with:
          username: cpoul
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Atomically reserve version and advance stable
        run: python3 extras/release/release.py advance
      - name: Publish the exact tested images
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: python3 extras/release/publish.py
      - name: Record the downstream GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 extras/release/release.py finish

  diagnose:
    needs: [prepare, validate, publish]
    if: always() && github.repository == 'cpouldev/opencloud-extra' && github.ref == 'refs/heads/extra/stable' && contains(needs.*.result, 'failure')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Report failure only in the downstream fork
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 extras/release/release.py diagnose
